<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trendline</title>
<style>:root{--bg:#fff;--fg:#000;--mu:#666;--gr:#ddd;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);box-sizing:border-box}:root[data-theme=dark]{--bg:#111;--fg:#ddd;--mu:#888;--gr:#2c2c2c}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 monospace}main{height:100%;display:flex;flex-direction:column;padding:12px 16px}h1,h2{font-size:14px;margin:16px 0 6px}h1,h2:first-child{margin-top:0}.h{display:flex;justify-content:space-between;align-items:baseline}p{margin:0 0 10px;color:var(--mu)}.g{display:grid;grid-template-columns:260px minmax(0,1fr) 270px;gap:16px;flex:1;min-height:0}.c1,.c2,.c3{display:flex;flex-direction:column;min-height:0}.c2{order:2}.c3{order:3}.sc{flex:1;min-height:0;overflow-y:auto}@media(max-width:900px){html,body{overflow:auto}.g{grid-template-columns:1fr}.c2{height:70vh}}table{border-collapse:collapse;width:100%}th{text-align:left;font-weight:400;color:var(--mu)}td{padding:0;border:1px solid var(--fg)}.n,.d{border:0}.n{color:var(--mu);width:28px;padding-right:4px;text-align:right}.d{width:24px}input,select,button{font:inherit;color:inherit;background:var(--bg);border:0;border-radius:0}input,select{padding:3px 5px;width:100%;outline:0}input:focus,select:focus{background:var(--gr)}.f{border:1px solid var(--fg)}.s{grid-column:span 2}.ax{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 6px;align-items:center}button{border:1px solid var(--fg);padding:2px 8px;cursor:pointer}button:hover{background:var(--fg);color:var(--bg)}.x{border:0;color:var(--mu);padding:0 6px}.r{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.o{border:1px solid var(--fg);flex:1;min-height:0;position:relative}svg{position:absolute;inset:0;width:100%;height:100%}pre{margin:10px 0 0;white-space:pre-wrap;word-break:break-all;font:inherit}.e{font-weight:700}</style>
</head>
<body>
<main>
<div class="h"><h1>trendline</h1><button id="th"></button></div>
<p>enter x and y, get a trend line. paste from a spreadsheet works.</p>
<div class="g">
<div class="c1">
<h2>data</h2>
<div class="sc"><table><thead><tr><th></th><th>x</th><th>y</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="r"><button id="add">+ row</button><button id="ex">example</button><button id="clr">clear</button></div>

</div>
<div class="c3">
<h2>fit</h2>
<div class="ax">
<span>type</span><span class="f s"><select id="type"><option value="lin">linear</option><option value="quad">quadratic</option><option value="exp">exponential</option></select></span>
<span>predict x</span><span class="f s"><input id="fx" type="number" step="any"></span>
</div>

<h2>axes</h2>
<div class="ax">
<span></span><span style="color:var(--mu)">min</span><span style="color:var(--mu)">max</span>
<span>x</span><span class="f"><input id="xmin" type="number" step="any" placeholder="auto"></span><span class="f"><input id="xmax" type="number" step="any" placeholder="auto"></span>
<span>y</span><span class="f"><input id="ymin" type="number" step="any" placeholder="auto"></span><span class="f"><input id="ymax" type="number" step="any" placeholder="auto"></span>
</div>
<div class="ax" style="margin-top:6px">
<span>x name</span><span class="f s"><input id="xl" placeholder="x"></span>
<span>y name</span><span class="f s"><input id="yl" placeholder="y"></span>
</div>
</div>

<div class="c2">
<div class="o"><svg id="svg"></svg></div>
<pre id="out"></pre>
<div class="r"><button id="dl">save png</button></div>
</div>
</div>
</main>
<script>
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg",tb=$("tb");
function row(x="",y=""){
  const tr=document.createElement("tr");
  tr.innerHTML=`<td class="n"></td><td><input class="cx" inputmode="decimal" value="${x}"></td><td><input class="cy" inputmode="decimal" value="${y}"></td><td class="d"><button class="x" title="delete row">x</button></td>`;
  tr.querySelector("button").onclick=()=>{tr.remove();if(!tb.rows.length)row2();num();run()};
  tb.appendChild(tr);num();return tr;
}
const row2=()=>row();
function num(){[...tb.rows].forEach((r,i)=>r.cells[0].textContent=i+1)}
function rows(){return [...tb.rows].map(r=>[r.querySelector(".cx").value,r.querySelector(".cy").value])}
function fill(a){tb.innerHTML="";a.forEach(r=>row(r[0],r[1]));if(!a.length)for(let i=0;i<12;i++)row();run()}
tb.addEventListener("input",run);
tb.addEventListener("paste",e=>{
  const t=(e.clipboardData||window.clipboardData).getData("text");
  if(!/[\n\t]/.test(t.trim()))return;
  e.preventDefault();
  const a=t.trim().split(/\r?\n/).map(l=>l.trim().replace(/,(?=\d{3}\b)/g,"").split(/[\t;, ]+/).filter(Boolean));
  fill(a.map((p,i)=>p.length>=2?[p[0],p[1]]:[i+1,p[0]]));
});
tb.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;e.preventDefault();
  const inp=e.target,tr=inp.closest("tr"),cls=inp.className;
  let nx=tr.nextElementSibling||row();
  nx.querySelector("."+cls).focus();
});
$("add").onclick=()=>{row().querySelector(".cx").focus()};
$("ex").onclick=()=>{fill([[1,12],[2,15],[3,14],[4,19],[5,23],[6,22],[7,28]]);$("fx").value=9;run()};
$("clr").onclick=()=>{fill([]);$("fx").value="";run()};

function solve(A,b){const n=b.length;
  for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;
    [A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];if(Math.abs(A[i][i])<1e-12)return null;
    for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}
  const x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i]}return x}
function polyfit(p,d){const x0=Math.min(...p.map(a=>a[0])),A=[],b=[];
  for(let i=0;i<=d;i++){A.push(Array(d+1).fill(0));b.push(0)}
  for(const [x,y] of p){const u=x-x0;for(let i=0;i<=d;i++){b[i]+=y*u**i;for(let j=0;j<=d;j++)A[i][j]+=u**(i+j)}}
  const c=solve(A,b);if(!c)return null;
  return d===1?[c[0]-c[1]*x0,c[1]]:[c[0]-c[1]*x0+c[2]*x0*x0,c[1]-2*c[2]*x0,c[2]]}
const f=v=>{if(!isFinite(v))return"-";const a=Math.abs(v);return a!==0&&(a>=1e7||a<1e-3)?v.toExponential(3):String(+v.toPrecision(6))};
function model(p,t){
  if(p.length<2)throw"need at least 2 points";
  if(t==="quad"&&p.length<3)throw"quadratic needs at least 3 points";
  if(t==="exp"){if(p.some(a=>a[1]<=0))throw"exponential needs y > 0";
    const c=polyfit(p.map(a=>[a[0],Math.log(a[1])]),1);if(!c)throw"all x are equal";
    const A=Math.exp(c[0]),B=c[1];return{fn:x=>A*Math.exp(B*x),eq:`y = ${f(A)} * e^(${f(B)} x)`,slope:null}}
  const c=polyfit(p,t==="quad"?2:1);if(!c)throw"all x are equal";
  if(t==="quad")return{fn:x=>c[0]+c[1]*x+c[2]*x*x,eq:`y = ${f(c[2])} x^2 + ${f(c[1])} x + ${f(c[0])}`.replace(/\+ -/g,"- "),slope:null};
  return{fn:x=>c[0]+c[1]*x,eq:`y = ${f(c[1])} x + ${f(c[0])}`.replace(/\+ -/g,"- "),slope:c[1]}}
function el(n,a,t){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e}
const tk=(lo,hi,n=5)=>Array.from({length:n+1},(_,i)=>lo+(hi-lo)*i/n);
const ov=id=>{const v=$(id).value;return v===""?null:+v};
function draw(p,m,fx){
  const svg=$("svg");svg.innerHTML="";
  const o=svg.parentNode,W=Math.max(300,o.clientWidth),H=Math.max(200,o.clientHeight),L=62,R=16,T=14,B=50;svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const xs=p.map(a=>a[0]);if(fx!=null)xs.push(fx);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=1;x1+=1}
  const ys=p.map(a=>a[1]);ys.push(m.fn(x0),m.fn(x1));if(fx!=null)ys.push(m.fn(fx));
  let y0=Math.min(...ys),y1=Math.max(...ys);const pd=(y1-y0||1)*.08;y0-=pd;y1+=pd;
  const a=ov("xmin"),b=ov("xmax"),c=ov("ymin"),d=ov("ymax");
  if(a!==null)x0=a;if(b!==null)x1=b;if(c!==null)y0=c;if(d!==null)y1=d;
  if(x1<=x0||y1<=y0)throw"axis max must be greater than min";
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>H-B-(y-y0)/(y1-y0)*(H-T-B);
  const fg="var(--fg)",mu="var(--mu)",gr="var(--gr)";
  svg.appendChild(el("rect",{width:W,height:H,fill:"var(--bg)"}));
  const cp=el("clipPath",{id:"cp"});cp.appendChild(el("rect",{x:L,y:T,width:W-L-R,height:H-T-B}));svg.appendChild(cp);
  tk(y0,y1).forEach(v=>{svg.appendChild(el("line",{x1:L,x2:W-R,y1:Y(v),y2:Y(v),stroke:gr}));svg.appendChild(el("text",{x:L-6,y:Y(v)+4,"text-anchor":"end","font-size":11,fill:mu,"font-family":"monospace"},f(v)))});
  tk(x0,x1).forEach(v=>{svg.appendChild(el("line",{x1:X(v),x2:X(v),y1:T,y2:H-B,stroke:gr}));svg.appendChild(el("text",{x:X(v),y:H-B+15,"text-anchor":"middle","font-size":11,fill:mu,"font-family":"monospace"},f(v)))});
  svg.appendChild(el("rect",{x:L,y:T,width:W-L-R,height:H-T-B,fill:"none",stroke:fg}));
  svg.appendChild(el("text",{x:(L+W-R)/2,y:H-8,"text-anchor":"middle","font-size":12,fill:fg,"font-family":"monospace"},$("xl").value||"x"));
  svg.appendChild(el("text",{transform:`translate(13 ${(T+H-B)/2}) rotate(-90)`,"text-anchor":"middle","font-size":12,fill:fg,"font-family":"monospace"},$("yl").value||"y"));
  const g=el("g",{"clip-path":"url(#cp)"});svg.appendChild(g);
  let path="";for(let i=0;i<=200;i++){const x=x0+(x1-x0)*i/200,y=m.fn(x);if(isFinite(y))path+=(path?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1)}
  g.appendChild(el("path",{d:path,fill:"none",stroke:fg,"stroke-width":1.5}));
  p.forEach(q=>g.appendChild(el("rect",{x:X(q[0])-3.5,y:Y(q[1])-3.5,width:7,height:7,fill:fg})));
  if(fx!=null)g.appendChild(el("rect",{x:X(fx)-4.5,y:Y(m.fn(fx))-4.5,width:9,height:9,fill:"var(--bg)",stroke:fg,"stroke-width":1.5}));
}
function run(){
  const out=$("out");
  try{
    const p=rows().map(r=>[parseFloat(String(r[0]).replace(",",".")),parseFloat(String(r[1]).replace(",","."))]).filter(r=>isFinite(r[0])&&isFinite(r[1]));
    const m=model(p,$("type").value);
    const fx=ov("fx"),my=p.reduce((s,a)=>s+a[1],0)/p.length;
    const ssr=p.reduce((s,a)=>s+(a[1]-m.fn(a[0]))**2,0),sst=p.reduce((s,a)=>s+(a[1]-my)**2,0);
    draw(p,m,fx);
    let t=`<span class="e">${m.eq}</span>\n`;
    if(m.slope!==null)t+=`slope  ${f(m.slope)}\n`;
    t+=`r^2    ${f(sst?1-ssr/sst:1)}\npoints ${p.length}`;
    if(fx!=null)t+=`\ny(${f(fx)}) = ${f(m.fn(fx))}`;
    out.innerHTML=t;
  }catch(e){$("svg").innerHTML="";out.textContent=typeof e==="string"?e:"error"}
}
["type","fx","xmin","xmax","ymin","ymax","xl","yl"].forEach(i=>$(i).addEventListener("input",run));
$("dl").onclick=()=>{
  const svg=$("svg");if(!svg.firstChild)return;
  let s=new XMLSerializer().serializeToString(svg);const cs=getComputedStyle(document.documentElement);
  ["--bg","--fg","--mu","--gr"].forEach(v=>{s=s.split(`var(${v})`).join(cs.getPropertyValue(v).trim())});
  const im=new Image();im.onload=()=>{const c=document.createElement("canvas");const vb=svg.viewBox.baseVal;c.width=vb.width*2;c.height=vb.height*2;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    const a=document.createElement("a");a.download="trend.png";a.href=c.toDataURL("image/png");a.click()};
  im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
};
const rt=document.documentElement;
function setTheme(t,save){rt.dataset.theme=t;$("th").textContent="theme: "+t;if(save)try{localStorage.setItem("tl-theme",t)}catch(e){}}
let st=null;try{st=localStorage.getItem("tl-theme")}catch(e){}
setTheme(st||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),false);
$("th").onclick=()=>setTheme(rt.dataset.theme==="dark"?"light":"dark",true);
addEventListener("resize",run);fill([]);
</script>
</body>
</html>
